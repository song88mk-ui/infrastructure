{{- range $app := .Values.apps }}
---
kind: Application
apiVersion: argoproj.io/v1alpha1
metadata:
  name: {{ $app.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    env: {{ $.Values.environment }}
  annotations:
    {{- if .workflowId }}
    ci.github.com/workflow-id: "{{ .workflowId }}"
    {{- else if $.Values.workflowId }}
    ci.github.com/workflow-id: "{{ $.Values.workflowId }}"
    {{- end }}
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/write-back-method: git
    {{- if .appImageOverride }}
    argocd-image-updater.argoproj.io/write-back-target: "helmvalues:/argocd-image-updater/{{ $.Values.namespace }}/{{ $app.config | default $app.name }}/{{ $.Values.environment }}.yaml"
    argocd-image-updater.argoproj.io/image-list: "appimage={{ $.Values.accountID }}.dkr.ecr.{{ $.Values.awsRegion }}.amazonaws.com/{{ .appImageOverride }}"
    {{- else }}
    argocd-image-updater.argoproj.io/write-back-target: "helmvalues:/argocd-image-updater/{{ $.Values.namespace }}/{{ $app.config | default $app.name }}/{{ $.Values.environment }}.yaml"
    argocd-image-updater.argoproj.io/image-list: "appimage={{ $.Values.accountID }}.dkr.ecr.{{ $.Values.awsRegion }}.amazonaws.com/{{ $.Values.appPrefix}}-{{ $app.config | default $app.name }}"
    {{- end }}
    argocd-image-updater.argoproj.io/appimage.update-strategy: {{ $.Values.updateStrategy | default "newest-build" }}
    argocd-image-updater.argoproj.io/appimage.allow-tags: "regexp:{{ $.Values.tagRegex }}"
    argocd-image-updater.argoproj.io/appimage.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/appimage.helm.image-tag: image.tag
    notifications.argoproj.io/subscriptions: |
        - trigger: [on-deployed, on-health-degraded, on-sync-failed, on-sync-running, on-sync-status-unknown, on-sync-succeeded ]
          destinations:
            - service: slack
              recipients: [argocd-deploy-{{ $.Values.environment }}]
spec:
  destination:
    server: "https://kubernetes.default.svc"
    namespace: {{ $.Values.namespace }}

  source:
    repoURL: "git@github.com:FlyingCockatoo/argocd.git"
    path: charts/{{ .chart }}
    targetRevision: HEAD
    helm:
      ignoreMissingValueFiles: true
      valueFiles:
        {{- if .valueFilesOverride }}
        {{- range $vf := .valueFilesOverride }}
        - {{ $vf }}
        {{- end }}
        {{- else }}
        - ../../apps/{{ $.Values.namespace }}/{{ $app.config | default $app.name }}/{{ $.Values.environment }}.yaml
        - ../../argocd-image-updater/{{ $.Values.namespace }}/{{ $app.config | default $app.name }}/{{ $.Values.environment }}.yaml
        {{- range $vf := .valueFiles }}
        - ../../apps/{{ $.Values.namespace }}/{{ $app.config | default $app.name }}/{{ $vf }}
        {{- end}}
        {{- end}}
      {{- if .rawValuesContents }}
      values: |
        {{- toYaml .rawValuesContents | nindent 8 }}
      {{- end }}

  project: {{ $.Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
{{- end }}
