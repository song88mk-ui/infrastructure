notifications:
  notifiers:
    service.slack: |
      token: $slack-token
    service.grafana: |
      apiUrl: http://prometheus-operator-grafana.monitoring/api
      apiKey: $grafana-apiKey
    service.webhook.main: |
      url: https://hooks.3704labs.com/argocd/song88
      headers:
      - name: Content-Type
        value: application/json
  subscriptions:
    - recipients:
      - main
      triggers:
      - on-sync-status-unknown
      - on-sync-succeeded
      - on-sync-running
      - on-sync-failed
      - on-health-degraded
      - on-deployed
      - on-deleted
  enabled: true
  templates:
    template.app-deleted: |
      message: Application {{.app.metadata.name}} has been deleted.
      webhook:
        main:
          method: POST
          body: |
            {
              "action": "app-deleted",
              "name": "{{ .app.metadata.name }}",
              "syncstatus": "{{ .app.status.sync.status }}",
              "environment": "{{ .app.metadata.labels.env }}",
              "revision": "{{ .app.status.sync.revision }}",
              "namespace": "{{ .app.metadata.namespace }}",
              "project": "{{ .app.spec.project }}",
              "images": "{{ .app.status.summary.images }}",
              "healthstatus": "{{ .app.status.health.status }}",
              "phase": "{{ .app.status.operationState.phase }}"
            }
    template.app-deployed: |
      message: |
        {{if eq .serviceType "slack"}}:white_check_mark:{{end}} Application {{.app.metadata.name}} is now running new version of deployments manifests.
      webhook:
        main:
          method: POST
          body: |
            {
              "action": "app-deployed",
              "name": "{{ .app.metadata.name }}",
              "syncstatus": "{{ .app.status.sync.status }}",
              "environment": "{{ .app.metadata.labels.env }}",
              "revision": "{{ .app.status.sync.revision }}",
              "namespace": "{{ .app.metadata.namespace }}",
              "project": "{{ .app.spec.project }}",
              "images": "{{ .app.status.summary.images }}",
              "healthstatus": "{{ .app.status.health.status }}",
              "phase": "{{ .app.status.operationState.phase }}"
            }
      slack:
        attachments: |
          [{
            "title": "{{ .app.metadata.name}}",
            "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#18be52",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Environment",
              "value": "{{.app.metadata.labels.env}}",
              "short": true
            },
            {
              "title": "Revision",
              "value": "{{.app.status.sync.revision}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            {{if not $index}},{{end}}
            {{if $index}},{{end}}
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
    template.app-health-degraded: |
      message: |
        {{if eq .serviceType "slack"}}:exclamation:{{end}} Application {{.app.metadata.name}} has degraded.
        Application details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}.
      webhook:
        main:
          method: POST
          body: |
            {
              "action": "app-health-degraded",
              "name": "{{ .app.metadata.name }}",
              "syncstatus": "{{ .app.status.sync.status }}",
              "environment": "{{ .app.metadata.labels.env }}",
              "revision": "{{ .app.status.sync.revision }}",
              "namespace": "{{ .app.metadata.namespace }}",
              "project": "{{ .app.spec.project }}",
              "images": "{{ .app.status.summary.images }}",
              "healthstatus": "{{ .app.status.health.status }}",
              "phase": "{{ .app.status.operationState.phase }}"
            }
      slack:
        attachments: |-
          [{
            "title": "{{ .app.metadata.name}}",
            "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#f4c030",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Environment",
              "value": "{{.app.metadata.labels.env}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            {{if not $index}},{{end}}
            {{if $index}},{{end}}
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
    template.app-sync-failed: |
      message: |
        {{if eq .serviceType "slack"}}:exclamation:{{end}}  The sync operation of application {{.app.metadata.name}} has failed at {{.app.status.operationState.finishedAt}} with the following error: {{.app.status.operationState.message}}
        Sync operation details are available at: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}?operation=true .
      webhook:
        main:
          method: POST
          body: |
            {
              "action": "app-sync-failed",
              "name": "{{ .app.metadata.name }}",
              "syncstatus": "{{ .app.status.sync.status }}",
              "environment": "{{ .app.metadata.labels.env }}",
              "revision": "{{ .app.status.sync.revision }}",
              "namespace": "{{ .app.metadata.namespace }}",
              "project": "{{ .app.spec.project }}",
              "images": "{{ .app.status.summary.images }}",
              "healthstatus": "{{ .app.status.health.status }}",
              "phase": "{{ .app.status.operationState.phase }}"
            }
      slack:
        attachments: |-
          [{
            "title": "{{ .app.metadata.name}}",
            "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#E96D76",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Environment",
              "value": "{{.app.metadata.labels.env}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            {{if not $index}},{{end}}
            {{if $index}},{{end}}
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
    template.app-sync-running: |
      message: |
        The sync operation of application {{.app.metadata.name}} has started at {{.app.status.operationState.startedAt}}.
        Sync operation details are available at: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}?operation=true .
      webhook:
        main:
          method: POST
          body: |
            {
              "action": "app-sync-running",
              "name": "{{ .app.metadata.name }}",
              "syncstatus": "{{ .app.status.sync.status }}",
              "environment": "{{ .app.metadata.labels.env }}",
              "revision": "{{ .app.status.sync.revision }}",
              "namespace": "{{ .app.metadata.namespace }}",
              "project": "{{ .app.spec.project }}",
              "images": "{{ .app.status.summary.images }}",
              "healthstatus": "{{ .app.status.health.status }}",
              "phase": "{{ .app.status.operationState.phase }}"
            }
      slack:
        attachments: |-
          [{
            "title": "{{ .app.metadata.name}}",
            "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#0DADEA",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Environment",
              "value": "{{.app.metadata.labels.env}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            {{if not $index}},{{end}}
            {{if $index}},{{end}}
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
    template.app-sync-status-unknown: |
      message: |
        {{if eq .serviceType "slack"}}:exclamation:{{end}} Application {{.app.metadata.name}} sync is 'Unknown'.
        Application details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}.
        {{if ne .serviceType "slack"}}
        {{range $c := .app.status.conditions}}
            * {{$c.message}}
        {{end}}
        {{end}}
      webhook:
        main:
          method: POST
          body: |
            {
              "action": "app-sync-status-unknown",
              "name": "{{ .app.metadata.name }}",
              "syncstatus": "{{ .app.status.sync.status }}",
              "environment": "{{ .app.metadata.labels.env }}",
              "revision": "{{ .app.status.sync.revision }}",
              "namespace": "{{ .app.metadata.namespace }}",
              "project": "{{ .app.spec.project }}",
              "images": "{{ .app.status.summary.images }}",
              "healthstatus": "{{ .app.status.health.status }}",
              "phase": "{{ .app.status.operationState.phase }}"
            }
      slack:
        attachments: |-
          [{
            "title": "{{ .app.metadata.name}}",
            "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#E96D76",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Environment",
              "value": "{{.app.metadata.labels.env}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            {{if not $index}},{{end}}
            {{if $index}},{{end}}
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
    template.app-sync-succeeded: |
      message: |
        {{if eq .serviceType "slack"}}:white_check_mark:{{end}} Application {{.app.metadata.name}} has been successfully synced at {{.app.status.operationState.finishedAt}}.
        Sync operation details are available at: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}?operation=true .
      webhook:
        main:
          method: POST
          body: |
            {
              "action": "app-sync-succeeded",
              "name": "{{ .app.metadata.name }}",
              "syncstatus": "{{ .app.status.sync.status }}",
              "environment": "{{ .app.metadata.labels.env }}",
              "revision": "{{ .app.status.sync.revision }}",
              "namespace": "{{ .app.metadata.namespace }}",
              "project": "{{ .app.spec.project }}",
              "images": "{{ .app.status.summary.images }}",
              "healthstatus": "{{ .app.status.health.status }}",
              "phase": "{{ .app.status.operationState.phase }}"
            }
      slack:
        attachments: |-
          [{
            "title": "{{ .app.metadata.name}}",
            "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#18be52",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Environment",
              "value": "{{.app.metadata.labels.env}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            {{if not $index}},{{end}}
            {{if $index}},{{end}}
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
  triggers:
     trigger.on-deployed: |
       - description: Application is synced and healthy. Triggered once per commit.
         oncePer: app.status.sync.revision
         send:
         - app-deployed
         when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
     trigger.on-health-degraded: |
       - description: Application has degraded
         send:
         - app-health-degraded
         when: app.status.health.status == 'Degraded'
     trigger.on-sync-failed: |
       - description: Application syncing has failed
         send:
         - app-sync-failed
         when: app.status.operationState.phase in ['Error', 'Failed']
     trigger.on-sync-running: |
       - description: Application is being synced
         send:
         - app-sync-running
         when: app.status.operationState.phase in ['Running']
     trigger.on-sync-status-unknown: |
       - description: Application status is 'Unknown'
         send:
         - app-sync-status-unknown
         when: app.status.sync.status == 'Unknown'
     trigger.on-sync-succeeded: |
       - description: Application syncing has succeeded
         send:
         - app-sync-succeeded
         when: app.status.operationState.phase in ['Succeeded']
     trigger.on-deleted: |
       - description: Application is deleted.
         oncePer: app.metadata.name
         send:
         - app-deleted
         when: "app.metadata.deletionTimestamp != nil"

     defaultTriggers: |
       - on-sync-failed
       - on-health-degraded
       - on-deleted
       - on-sync-status-unknown
