apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq-main-cluster
  namespace: dev
spec:
  replicas: 1
  persistence:
    storageClassName: "gp3"
  resources:
    requests:
      cpu: 100m
      memory: 800Mi
  rabbitmq:
    additionalPlugins:
    - rabbitmq_management
    - rabbitmq_prometheus
