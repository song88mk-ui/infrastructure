{{- range $app := .Values.apps }}
---
kind: Application
apiVersion: argoproj.io/v1alpha1
metadata:
  name: {{ $app.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    env: {{ $.Values.environment }}
  annotations:
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/image-list: "appimage={{ $.Values.accountID }}.dkr.ecr.{{ $.Values.awsRegion }}.amazonaws.com/{{ $.Values.appPrefix}}-{{ $app.config | default $app.name }}"
    argocd-image-updater.argoproj.io/appimage.update-strategy: newest-build
{{- if $.Values.tagPrefix }}
    argocd-image-updater.argoproj.io/appimage.allow-tags: "regexp:{{ $.Values.tagPrefix }}"
{{- else if $.Values.tagSuffix }}
    argocd-image-updater.argoproj.io/appimage.allow-tags: "regexp:^.*{{ $.Values.tagSuffix }}$"
{{- end }}
    argocd-image-updater.argoproj.io/appimage.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/appimage.helm.image-tag: image.tag
    notifications.argoproj.io/subscriptions: |
        - trigger: [on-deployed, on-health-degraded, on-sync-failed, on-sync-running, on-sync-status-unknown, on-sync-succeeded ]
          destinations:
            - service: slack
              recipients: [argocd-deploy-{{ $.Values.environment }}]
spec:
  destination:
    server: "https://kubernetes.default.svc"
    namespace: {{ $.Values.namespace }}

  source:
    repoURL: "git@github.com:FlyingCockatoo/argocd.git"
    path: charts/{{ .chart }}
    targetRevision: HEAD
    helm:
      valueFiles:
        - ../../apps/{{ $.Values.namespace }}/{{ $app.config | default $app.name }}/{{ $.Values.environment }}.yaml
        {{- range $vf := .valueFiles }}
        - ../../apps/{{ $.Values.namespace }}/{{ $app.config | default $app.name }}/{{ $vf }}
        {{- end}}

  project: {{ $.Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
{{- end }}
