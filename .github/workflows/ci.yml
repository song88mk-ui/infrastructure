name: Terraform

on:
  pull_request:

  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    name: Plan / ${{ matrix.env.path }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        env:
        - path: "live/aws-plat-stg/stg"
          region: ap-south-1
          account_id: 172065883315
        - path: "live/aws-plat-stg/global"
          region: ap-south-1
          account_id: 172065883315
        - path: "live/aws-plat-prd/prd"
          region: ap-east-1
          account_id: 525375333516
        - path: "live/aws-plat-prd/global"
          region: ap-east-1
          account_id: 525375333516
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5
        with:
          aws-region: ${{ matrix.env.region }}
          role-to-assume: arn:aws:iam::${{ matrix.env.account_id }}:role/github-oidc-terraform-plan-role
          role-duration-seconds: 3600

      - name: Format check
        run: nix-shell --run "terragrunt hcl fmt --check"

      - name: Run plan
        run: nix-shell --run "cd ${{ matrix.env.path }} && terragrunt run --all -- plan"
        env:
          TG_PROVIDER_CACHE: 1
          TG_NON_INTERACTIVE: 1
