- name: EBS volumes
  hosts: all
  become: true
  become_user: root

  roles:
    - name: ansible-ebs-automatic-nvme-mapping

  pre_tasks:
  - name: Install utilities
    apt:
      update_cache: true
      pkg:
        - unzip
        - vim
        - curl
        - tar
        - nvme-cli
        - iftop
        - iotop

  tasks:
    - name: Ensure mount points exist
      file:
        path: "{{ item.mount_point }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: "{{ volumes }}"

    - name: Create an ext4 filesystem
      filesystem:
        fstype: ext4
        state: present
        dev: "{{ item.device }}"
      loop: "{{ volumes }}"
    
    - name: Mount the EBS volumes
      mount:
        src: "{{ item.device }}"
        path: "{{ item.mount_point }}"
        fstype: ext4
        state: mounted
        opts: "discard,defaults,nofail"
        passno: 2
      loop: "{{ volumes }}"
