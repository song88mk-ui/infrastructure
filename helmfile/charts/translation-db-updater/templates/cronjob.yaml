apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "translation-db-updater.name" . }}
  labels:
    {{- include "translation-db-updater.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            {{- include "translation-db-updater.labels" . | nindent 12 }}
        spec:
          restartPolicy: {{ .Values.cronjob.restartPolicy }}
          activeDeadlineSeconds: 1000
          terminationGracePeriodSeconds: 15
          initContainers:
            - name: pip-install
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/bin/bash", "-c"]
              args:
                - pip install --target /deps deepl==1.30.0 mssql_python==1.7.1 structlog==25.5.0 tenacity==9.1.4 requests==2.34.2
              volumeMounts:
                - name: deps
                  mountPath: /deps
          containers:
            - name: updater
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                {{- range $key, $value := .Values.env }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
                - name: PYTHONPATH
                  value: "/deps"
                {{- range $secret := .Values.secrets }}
                {{- range $entry := $secret.data }}
                - name: {{ $entry.envVariable }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secret.name }}
                      key: {{ $entry.key }}
                {{- end }}
                {{- end }}
              command: ["/bin/bash", "-c"]
              args:
                - apt update -qq && apt-get install -y libltdl7 libkrb5-3 libgssapi-krb5-2 && python /app/update.py
              volumeMounts:
                - name: app-code
                  mountPath: /app
                - name: deps
                  mountPath: /deps
          volumes:
            - name: app-code
              configMap:
                name: {{ include "translation-db-updater.fullname" . }}-script
            - name: deps
              emptyDir: {}
