---
all:
  hosts:
    mongodb:
      ansible_host: 10.29.100.172
      ansible_python_interpreter: /usr/bin/python3
      ansible_user: ubuntu
      aws_env: dev
      aws_region: ap-south-1
      mongodb_admin_password: /dev/mongodb/admin-password

      # The device names are taken from terraform.
      volumes:
        - device: /dev/sdk
          mount_point: /var/lib/mongodb

  vars:
    ansible_user: ubuntu
    aws_env: dev
    aws_region: ap-south-1
