#cloud-config
cloud_config_modules:
- runcmd
cloud_final_modules:
- [users-groups,always]
- [scripts-user,always]
runcmd:
  - mkdir /etc/twingate
  - echo TWINGATE_URL="https://song88.twingate.com" > /etc/twingate/connector.conf
  - echo TWINGATE_ACCESS_TOKEN="${access_token}" >> /etc/twingate/connector.conf
  - echo TWINGATE_REFRESH_TOKEN="${refresh_token}" >> /etc/twingate/connector.conf
  - systemctl enable twingate-connector
  - systemctl start twingate-connector
