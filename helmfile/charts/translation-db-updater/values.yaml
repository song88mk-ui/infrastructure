image:
  repository: python
  tag: "3.13-slim"
  pullPolicy: IfNotPresent

cronjob:
  schedule: "*/20 * * * *" # Every 10 minutes
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  restartPolicy: Never

script:
  name: update.py
  command: ["python", "/scripts/update.py"]

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

env: []
