---
- name: Setup MongoDB
  hosts: mongodb
  become: yes
  vars:
    node_exporter_version: "1.10.2"
    node_exporter_web_listen_address: "0.0.0.0:9092"

  roles:
    - name: community.mongodb.mongodb_linux
    - name: community.mongodb.mongodb_repository
      vars:
        mongodb_version: "8.0"
    - name: community.mongodb.mongodb_install
    - name: community.mongodb.mongodb_mongod
      vars:
        authorization: true
        mongodb_admin_user: admin
        mongodb_admin_pwd: "{{ lookup('aws_ssm', mongodb_admin_password, region=aws_region) }}"
        mongodb_logrotate_enabled: false
        db_path: /var/lib/mongodb
    - name: prometheus.prometheus.node_exporter
      tags:
        - monitoring
    - name: prometheus.prometheus.mongodb_exporter
      vars:
        mongodb_exporter_web_listen_address: "0.0.0.0:9216"
        mongodb_exporter_version: "0.49.0"
        mongodb_exporter_discovering_mode: true
        mongodb_exporter_collectors: "all"
      tags:
        - monitoring

  pre_tasks:
  - name: Install utilities
    apt:
      update_cache: true
      pkg:
        - python3-pip
        - python3-pymongo

  tasks:
    - name: Initialise MongoDB Replicaset rs0
      community.mongodb.mongodb_replicaset:
        login_host: localhost
        replica_set: "rs0"
        members: "{{ groups['mongodb'] }}"
        validate: false
      when: ansible_hostname == "mongo_01"
      register: repl

    - name: Ensure replicaset has reached a converged state
      community.mongodb.mongodb_status:
        replica_set: "rs0"
        poll: 10
        interval: 10
      when: repl.changed == True

    - name: Create systemd drop-in directory
      ansible.builtin.file:
        path: "/etc/systemd/system/mongod.service.d"
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - systemd

    - name: Add restart-on-failure drop-in
      ansible.builtin.copy:
        dest: "/etc/systemd/system/mongod.service.d/override.conf"
        content: |
          [Service]
          Restart=on-failure
          RestartSec=10s
        mode: "0644"
      register: dropin
      tags:
        - systemd

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: dropin.changed
      tags:
        - systemd
