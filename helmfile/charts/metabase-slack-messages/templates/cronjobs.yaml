---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "metabase-slack-messages.name" . }}-daily
  labels:
    {{- include "metabase-slack-messages.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.daily_job.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  timeZone: "Asia/Manila"

  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            {{- include "metabase-slack-messages.labels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 15
          initContainers:
            - name: pip-install
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/bin/bash", "-c"]
              args:
                - pip install --target /deps requests>=2.28 pandas>=1.5 openpyxl>=3.1 Pillow>=9.4 slack_sdk>=3.21
              volumeMounts:
                - name: deps
                  mountPath: /deps
          containers:
            - name: updater
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                {{- range $key, $value := .Values.env }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
                - name: PYTHONPATH
                  value: "/deps"
                {{- range $secret := .Values.secrets }}
                {{- range $entry := $secret.data }}
                - name: {{ $entry.envVariable }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secret.name }}
                      key: {{ $entry.key }}
                {{- end }}
                {{- end }}
              command: ["/bin/bash", "-c"]
              args:
                - python /app/daily.py
              volumeMounts:
                - name: app-code
                  mountPath: /app
                - name: images
                  mountPath: /images
                - name: deps
                  mountPath: /deps
          volumes:
            - name: app-code
              configMap:
                name: {{ include "metabase-slack-messages.fullname" . }}-scripts
            - name: images
              configMap:
                name: {{ include "metabase-slack-messages.fullname" . }}-images
            - name: deps
              emptyDir: {}
