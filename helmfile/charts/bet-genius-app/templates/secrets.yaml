{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .name }}
spec:
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: main
    kind: ClusterSecretStore
  target:
    creationPolicy: Owner
  data:
    - secretKey: {{ .key }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- if .remoteProperty }}
        property: {{ .remoteProperty }}
        {{- end }}
{{- end }}
