apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "version-manifest.fullname" . }}-app
  labels:
    {{- include "version-manifest.labels" . | nindent 4 }}
data:
  app.py: |
    import os
    import re
    import hashlib
    import requests
    from datetime import date, datetime, timezone
    from dateutil import parser as dateutil_parser
    from flask import Flask, jsonify, Response

    ARGOCD_URL = os.environ["ARGOCD_SERVER_URL"].rstrip("/")
    TOKEN      = os.environ["ARGOCD_TOKEN"].strip()
    VERIFY_TLS = os.environ.get("ARGOCD_INSECURE", "true").lower() != "true"

    # Components whose versions are used to compute the release SHA.
    SELECTED_COMPONENTS = [
        "bet-genius/bg-engine-sportsbook",
        "bet-genius/bg-feed-receiver-api",
        "bet-genius/bg-feedlogger-service",
        "bet-genius/bg-heartbeat-listener",
        "bet-genius/bg-rabbitmq-api",
        "bet-genius/bg-receiver-service",
        "bet-genius/platform-api-ro",
        "oddsengine/adapter-service",
        "oddsengine/job-cleanup",
        "oddsengine/job-keepalive",
        "oddsengine/job-livestream",
        "oddsengine/job-settlement",
        "oddsengine/sportsbook-service-00",
        "oddsengine/sportsbook-service-01",
        "oddsengine/sportsbook-service-02",
        "oddsengine/sportsbook-service-03",
        "oddsengine/sportsbook-service-04",
        "oddsengine/sportsbook-service-05",
        "oddsengine/sportsbook-service-06",
        "oddsengine/sportsbook-service-07",
        "oddsengine/sportsbook-service-08",
        "oddsengine/sportsbook-service-09",
        "oddsengine/sportsbook-service-10",
        "oddsengine/uof-client-g00",
        "oddsengine/websocket-service-g00",
        "oddsengine/websocket-service-krj",
        "oddsengine/websocket-service-oge",
        "oddsengine/websocket-service-qte",
        "platform/auth-api",
        "platform/betting-api",
        "platform/cashout-service",
        "platform/cashoutstake-service",
        "platform/clientplatform-api",
        "platform/job-forexeur",
        "platform/job-resettlement",
        "platform/operator-api",
        "platform/operator-service",
        "platform/placement-service",
        "platform/platform-api",
        "platform/provider-service",
        "platform/rabbitmq-api",
        "platform/settlement-service",
        "platform/song88",
        "platform/sportsbook-api",
        "platform/wallet-api",
        "platform/web",
        "platform/web-assets",
        "platform/webprops-api",
        "platform/websocket-api",
    ]

    app = Flask(__name__)

    def parse_utc(iso: str) -> datetime:
        dt = dateutil_parser.parse(iso)
        if dt.tzinfo is None:
            dt = dt.replace(tzinfo=timezone.utc)
        return dt.astimezone(timezone.utc)

    def get_latest_version(deployed_date: datetime) -> str:
        return "26.31"
 
    def fetch_apps():
        resp = requests.get(
            f"{ARGOCD_URL}/api/v1/applications",
            headers={"Authorization": f"Bearer {TOKEN}"},
            verify=VERIFY_TLS,
            timeout=10,
        )
        resp.raise_for_status()
        return resp.json()

    def latest_date(apps):
        dates = []
        for k, v in apps.items():
            if k in SELECTED_COMPONENTS:
                raw = v.get("deployed_at")
                if raw:
                    dates.append(parse_utc(raw))
        if not dates:
            raise ValueError("No valid deployment dates found for selected components")
        return max(dates)
 
    def get_revisions(data):
        revisions = set()
        apps = {}
        for item in data.get("items", []):
            name = item["metadata"]["name"]
            name = name.removeprefix("bet-genius-apps-")
            namespace = item["metadata"]["namespace"]
            if namespace == "argocd":
                namespace = "bet-genius"
            key = f"{namespace}/{name}"
            images = (
                item.get("status", {})
                   .get("summary", {})
                   .get("images", [])
            )
            tags = [re.sub(r"-(stg|prd)$", "", img.split(":")[-1] if ":" in img else None) for img in images]
            tag = tags[0] if len(tags) == 1 else tags
            deployed_at = (
                item.get("status", {})
                    .get("operationState", {})
                    .get("finishedAt", None)
            )
            apps[key] = {"version": tag, "deployed_at": deployed_at}
            sync   = item.get("status", {}).get("sync", {})
            revision = sync.get("revision", None)
            revisions.add(revision)

        revision = revisions.pop()
        last_deployed_date = latest_date(apps)

        app.logger.info(f"Latest deployment was: {last_deployed_date}")

        return {
            "version": f"{get_latest_version(last_deployed_date)}-{revision[:7]}",
            "apps": apps,
        }

    def compute_components_sha(apps: dict) -> str:
        parts = []
        for key in SELECTED_COMPONENTS:
            entry = apps.get(key, {})
            version = entry.get("version", "")
            # version may be a list when multiple images are present
            if isinstance(version, list):
                version = ",".join(str(v) for v in version)
            parts.append(str(version))

        combined = "".join(parts)
        return hashlib.sha256(combined.encode()).hexdigest()[:12]

    def format_as_text(data: dict) -> str:
        apps    = data["apps"]
        version = data.get("version", "unknown")
        sha     = compute_components_sha(apps)

        rows = sorted(
            [
                (key.split("/", 1)[1], key.split("/", 1)[0], v["version"], v["deployed_at"])
                for key, v in apps.items()
            ],
            key=lambda r: (r[1], r[0]),  # sort by namespace, then name
        )

        col_name = max(len("NAME"),        max(len(r[0]) for r in rows))
        col_ns   = max(len("NAMESPACE"),   max(len(str(r[1])) for r in rows))
        col_ver  = max(len("VERSION"),     max(len(str(r[2])) for r in rows))
        col_date = max(len("DEPLOYED AT"), max(len(r[3]) for r in rows))

        sep    = f"  {'─' * col_name}  {'─' * col_ns}  {'─' * col_ver}  {'─' * col_date}"
        header = f"  {'NAME':<{col_name}}  {'NAMESPACE':<{col_ns}}  {'VERSION':<{col_ver}}  {'DEPLOYED AT':<{col_date}}"

        lines = [
            f"Version:    {version}-{sha}",
            "",
            header,
            sep,
        ]
        for name, namespace, tag, deployed_at in rows:
            lines.append(f"  {name:<{col_name}}  {namespace:<{col_ns}}  {str(tag):<{col_ver}}  {deployed_at:<{col_date}}")

        return "\n".join(lines)


    @app.get("/versions")
    def versions():
        return Response(format_as_text(get_revisions(fetch_apps())), mimetype="text/plain")

    if __name__ == "__main__":
        port = int(os.environ.get("PORT", 8080))
        app.run(host="0.0.0.0", port=port)
