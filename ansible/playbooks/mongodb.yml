---
- name: Setup MongoDB
  hosts: mongodb
  become: yes
  vars:
    node_exporter_version: "1.10.2"
    node_exporter_web_listen_address: "0.0.0.0:9092"

  roles:
    - name: community.mongodb.mongodb_linux
    - name: community.mongodb.mongodb_repository
      vars:
        mongodb_version: "8.0"
    - name: community.mongodb.mongodb_install
    - name: community.mongodb.mongodb_mongod
      vars:
        authorization: true
        mongodb_admin_user: admin
        mongodb_admin_pwd: "{{ lookup('aws_ssm', mongodb_admin_password, region=aws_region) }}"
        mongodb_logrotate_enabled: true
        db_path: /var/lib/mongodb
    - name: prometheus.prometheus.node_exporter
      tags:
        - monitoring
    - name: prometheus.prometheus.mongodb_exporter
      vars:
        mongodb_exporter_web_listen_address: "0.0.0.0:9216"
        mongodb_exporter_version: "0.49.0"
        mongodb_exporter_discovering_mode: true
        mongodb_exporter_collectors: "all"
      tags:
        - monitoring

  pre_tasks:
  - name: Install utilities
    apt:
      update_cache: true
      pkg:
        - python3-pip
        - python3-pymongo

  tasks:
    - name: Initialise MongoDB Replicaset rs0
      community.mongodb.mongodb_replicaset:
        login_host: localhost
        replica_set: "rs0"
        members:
          - host: "{{ ansible_host }}"
        validate: false
      register: repl
      tags:
        - replicaset
