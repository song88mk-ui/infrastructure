global
  log stdout format raw local0
  maxconn 8192

defaults
  mode tcp
  option tcplog
  log global
  timeout connect 10s
  timeout client  1h      # long, so idle AMQP/DB connections aren't cut
  timeout server  1h

listen mongodb
  bind :27017
  server s1 mongodb:27017 check

listen mssql
  bind :1433
  mode tcp
  server s1 mssql-mssqlserver-2022:1433 check

listen amqp
  bind :5672
  server s1 rabbitmq-main-cluster:5672 check

listen rmq_mgmt
  bind :15672
  mode http
  server s1 rabbitmq-main-cluster:15672 check
