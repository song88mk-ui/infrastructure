image:
  repository: python
  tag: "3.13-slim"
  pullPolicy: IfNotPresent

cronjob:
  schedule: "0 * * * *" # Every hour
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  restartPolicy: OnFailure

script:
  name: update.py
  command: ["python", "/scripts/update.py"]

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
